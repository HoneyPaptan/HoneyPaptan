<svg xmlns="http://www.w3.org/2000/svg" width="211" height="140" viewBox="0 0 211 140" role="img" aria-label="hp, A coding agent that never dies."><title>hp, A coding agent that never dies.</title><defs><clipPath id="c"><rect width="201" height="136" rx="14"/></clipPath><clipPath id="art"><rect width="201" height="82"/></clipPath></defs><style>@font-face{font-family:PS;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:PS;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:PM;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}text{font-family:PS,Geist,Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:500}.ln{opacity:0;animation:ln 6s infinite}@keyframes ln{0%{opacity:0}4%{opacity:1}85%{opacity:1}95%{opacity:0}100%{opacity:0}}.cur{animation:cur 1s steps(1) infinite}@keyframes cur{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(5 0)" clip-path="url(#c)"><rect width="201" height="136" fill="#0e0e0e"/><g clip-path="url(#art)"><g class="ln" style="animation-delay:0.0s"><text x="12" y="22" font-size="10" fill="#d4d4d4" font-family="PM,'Geist Mono','GeistMono NF','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace">$ hp run &quot;fix flaky test&quot;</text></g><g class="ln" style="animation-delay:0.9s"><text x="12" y="37" font-size="10" fill="#a3a3a3" font-family="PM,'Geist Mono','GeistMono NF','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace">step 41  rate limit, wait 38s</text></g><g class="ln" style="animation-delay:1.8s"><text x="12" y="52" font-size="10" fill="#f5b83d" font-family="PM,'Geist Mono','GeistMono NF','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace">→ resumed after reboot</text></g><g class="ln" style="animation-delay:2.7s"><text x="12" y="67" font-size="10" fill="#a3a3a3" font-family="PM,'Geist Mono','GeistMono NF','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace">step 42  tests green</text></g><rect x="12" y="73" width="6" height="11" fill="#d4d4d4" class="cur"/></g><text x="13" y="104" font-size="16.5" fill="#fff" font-weight="600" letter-spacing="-.2">hp</text><text x="13" y="122" font-size="12.5" fill="#a3a3a3">A coding agent that never dies</text><text x="188" y="103.5" font-size="12.5" fill="#a3a3a3" text-anchor="end">new</text></g></svg>